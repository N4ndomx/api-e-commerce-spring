server.servlet.context-path=/best

spring.application.name=travelUno
spring.datasource.url=jdbc:postgresql://localhost:5432/best_one
spring.datasource.username=nando
spring.datasource.password=root
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# spring.jackson.deserialization.accept-float-as-int=false
spring.datasource.hikari.leak-detection-threshold=30000

# Variables de entorno para el manejo de errores
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-exception=true
